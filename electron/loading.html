<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Charlie Detector - Démarrage</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            color: white;
        }
        
        .loading-container {
            text-align: center;
            max-width: 500px;
            padding: 40px;
        }
        
        .logo {
            font-size: 4rem;
            margin-bottom: 20px;
            animation: bounce 2s infinite;
        }
        
        .title {
            font-size: 2.5rem;
            font-weight: bold;
            margin-bottom: 10px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.3);
        }
        
        .subtitle {
            font-size: 1.2rem;
            margin-bottom: 40px;
            opacity: 0.9;
        }
        
        .loading-spinner {
            width: 60px;
            height: 60px;
            border: 4px solid rgba(255,255,255,0.3);
            border-top: 4px solid white;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin: 0 auto 30px;
        }
        
        .loading-text {
            font-size: 1.1rem;
            margin-bottom: 20px;
        }
        
        .status-list {
            text-align: left;
            display: inline-block;
            margin-top: 20px;
        }
        
        .status-item {
            margin: 8px 0;
            font-size: 0.95rem;
            opacity: 0.8;
        }
        
        .status-icon {
            margin-right: 10px;
        }
        
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        
        @keyframes bounce {
            0%, 20%, 50%, 80%, 100% {
                transform: translateY(0);
            }
            40% {
                transform: translateY(-10px);
            }
            60% {
                transform: translateY(-5px);
            }
        }
        
        .progress-bar {
            width: 100%;
            height: 6px;
            background-color: rgba(255,255,255,0.3);
            border-radius: 3px;
            overflow: hidden;
            margin-top: 20px;
        }
        
        .progress-fill {
            height: 100%;
            background-color: white;
            border-radius: 3px;
            animation: progress 3s ease-in-out infinite;
        }
        
        @keyframes progress {
            0% { width: 0%; }
            50% { width: 70%; }
            100% { width: 100%; }
        }
    </style>
</head>
<body>
    <div class="loading-container">
        <div class="logo">🕵️</div>
        <h1 class="title">Charlie Detector</h1>
        <p class="subtitle">Détection intelligente avec IA</p>
        
        <div class="loading-spinner"></div>
        <div class="loading-text">Démarrage de l'application...</div>
        
        <div class="status-list">
            <div class="status-item">
                <span class="status-icon">🔄</span>
                Initialisation d'Electron
            </div>
            <div class="status-item">
                <span class="status-icon">🐍</span>
                Démarrage du backend YOLO
            </div>
            <div class="status-item">
                <span class="status-icon">🧠</span>
                Chargement du modèle IA
            </div>
            <div class="status-item">
                <span class="status-icon">🌐</span>
                Préparation de l'interface
            </div>
        </div>
        
        <div class="progress-bar">
            <div class="progress-fill"></div>
        </div>
    </div>

    <script>
        // Animation des statuts
        let currentStatus = 0;
        const statusItems = document.querySelectorAll('.status-item');
        
        function updateStatus() {
            if (currentStatus < statusItems.length) {
                statusItems[currentStatus].style.opacity = '1';
                statusItems[currentStatus].querySelector('.status-icon').textContent = '✅';
                currentStatus++;
                setTimeout(updateStatus, 1000);
            }
        }
        
        setTimeout(updateStatus, 1000);
    </script>
</body>
</html>
